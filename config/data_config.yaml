# Where the model finds its inputs. Paths are relative to the repository root.
# To run on another population, point population.dir at a folder with the same layout
# as synthetic_population/ (agents.parquet, networks/<layer>.csv, events/).

population:
  dir: synthetic_population
  network_file: networks/0.csv
  num_agents: auto

ground_truth:
  dir: danish_abm/data/ssi
  real_population: 5840000   # population of Denmark; counts are scaled by N / this

simulation:
  start_date: "2020-12-16"
  end_date: "2021-02-28"
  start_doy: 351
  prior_immunity_scale: 0.80

individual_data:
  test_data_csv: synthetic_population/events/tests.parquet
  vaccination_csv: synthetic_population/events/vaccinations.parquet

precomputed: {}
