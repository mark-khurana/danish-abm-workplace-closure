# AgentTorch model definition: state, substeps and their parameters.
# Population paths and parameters are overwritten at run time from config/.

simulation_metadata:
  ALIGN_LLM: true
  EXECUTION_MODE: heuristic
  EXPOSED_TO_INFECTED_TIME: 3
  EXPOSED_VAR: 1
  INCLUDE_WEEK_COUNT: true
  INFECTED_TO_RECOVERED_TIME: 5
  INFECTED_VAR: 2
  INFINITY_TIME: 150
  MORTALITY_VAR: 4
  NEIGHBORHOOD: Denmark
  NUM_TRAIN_WEEKS: 2
  NUM_WEEKS: 18
  OPENAI_API_KEY: None
  RECOVERED_TO_SUSCEPTIBLE_TIME: 999
  REINFECTION_SUSCEPTIBILITY: 0.5
  RECOVERED_VAR: 3
  RESCALE_CONFIG: 0
  START_WEEK: 202048
  SUSCEPTIBLE_VAR: 0
  USE_GROUND_TRUTH_4WK_AVG: false
  USE_GROUND_TRUTH_CASE_NUMBERS: false
  age_group_file: ${simulation_metadata.population_dir}/age.pickle
  calibration: true
  cuda_params:
    batch_size: 16384
    inplace_progress: true
    pool_limit_per_shape: 8
    snapshot_pack_bools: false
    snapshot_precision: fp16
  device: auto
  disease_stage_file: ${simulation_metadata.population_dir}/disease_stages.csv
  infection_network_file: ${simulation_metadata.population_dir}/mobility_networks/0.csv
  num_network_layers: 5
  symmetric_transmission: true
  network_layer_names:
  - family
  - household
  - neighborhood
  - colleague
  - classmate
  disease_params_distributional: false
  disease_params:
    latent_period:
      mean: 3.0
    infectious_period:
      mean: 5.0
    generation_time:
      mean: 5.5
    immunity_waning:
      mean: 999.0
  seasonal: null
  sim_start_doy: 244
  multi_strain: false
  strain_config:
    preset: null
  initial_infection_ratio: 0.0005
  learning_params:
    betas:
    - 0.5
    - 0.5
    lr: 0.05
    lr_gamma: 0.9999
    model_path: saved_model.pth
  mapping_path: ${simulation_metadata.population_dir}/mapping.json
  num_agents: 20000
  num_episodes: 5
  num_steps_per_episode: 122
  num_substeps_per_step: 4
  vaccination_enabled: false
  vaccination_strategy: age_priority
  vaccination_daily_capacity: 0
  vaccination_start_day: 0
  vaccination_vaccine_type: mrna_covid
  testing_enabled: false
  base_testing_rate: 0.01
  test_sensitivity: 0.8
  test_specificity: 0.99
  symptomatic_testing_multiplier: 5.0
  isolation_compliance: 0.8
  isolation_duration: 10
  isolation_effectiveness: 0.1
  hospitalization_delay: 0
  record_trajectory: false
  pathogen_preset: null
  compartment_config: null
  municipality_mixing: false
  individual_test_data_path: null
  vaccination_schedule_path: null
  population_dir: danish_abm/data/denmark_synthetic
  quarantine_days: 12
  test_ineligible_days: 2
  test_result_delay_days: 3
  trajectory_save_frequency: 1
state:
  agents:
    citizens:
      number: ${simulation_metadata.num_agents}
      properties:
        age:
          dtype: int
          initialization_function:
            arguments:
              attribute:
                initialization_function: null
                learnable: false
                name: Age
                shape: null
                value: age
              file_path:
                initialization_function: null
                learnable: false
                name: Filepath for age group stage
                shape:
                - 1
                value: ${simulation_metadata.age_group_file}
            generator: load_population_attribute
          learnable: false
          name: Age
          shape:
          - ${state.agents.citizens.number}
          - 1
        awaiting_test_result:
          dtype: bool
          initialization_function: null
          learnable: false
          name: agent is awaiting test result currently
          shape:
          - ${state.agents.citizens.number}
          - 1
          value: false
        disease_stage:
          dtype: int
          initialization_function:
            arguments:
              file_path:
                initialization_function: null
                learnable: false
                name: Disease Stage File
                shape:
                - 1
                value: ${simulation_metadata.disease_stage_file}
            generator: read_from_file
          learnable: false
          name: Disease Stage
          shape:
          - ${state.agents.citizens.number}
          - 1
        id:
          dtype: float
          initialization_function:
            arguments:
              pop_size:
                initialization_function: null
                learnable: false
                name: population size
                shape:
                - 1
                value: ${simulation_metadata.num_agents}
            generator: initialize_id
          learnable: false
          name: id
          shape:
          - ${state.agents.citizens.number}
          - 1
        infected_time:
          dtype: int
          initialization_function:
            arguments:
              file_path:
                initialization_function: null
                learnable: false
                name: Filepath for initial disease stages
                shape: null
                value: ${simulation_metadata.disease_stage_file}
              num_steps:
                initialization_function: null
                learnable: false
                name: Num steps per episode
                shape:
                - 1
                value: ${simulation_metadata.num_steps_per_episode}
            generator: get_infected_time
          learnable: false
          name: Last Infected timestep
          shape:
          - ${state.agents.citizens.number}
          - 1
        is_quarantined:
          dtype: bool
          initialization_function: null
          learnable: false
          name: Quarantine status for a citizen
          shape:
          - ${state.agents.citizens.number}
          - 1
          value: false
        next_stage_time:
          dtype: int
          initialization_function:
            arguments:
              file_path:
                initialization_function: null
                learnable: false
                name: Filepath for initial disease stages
                shape: null
                value: ${simulation_metadata.disease_stage_file}
              num_steps:
                initialization_function: null
                learnable: false
                name: Num steps per episode
                shape:
                - 1
                value: ${simulation_metadata.num_steps_per_episode}
            generator: get_next_stage_time
          learnable: false
          name: Timestep for next transition
          shape:
          - ${state.agents.citizens.number}
          - 1
          value: 0
        quarantine_start_date:
          dtype: int
          initialization_function: null
          learnable: false
          name: Start date for last quarantine of agent
          shape:
          - ${state.agents.citizens.number}
          - 1
          value: ${simulation_metadata.INFINITY_TIME}
        test_re_eligble_date:
          dtype: int
          initialization_function: null
          learnable: false
          name: Date when agent becomes eligible for taking a test again
          shape:
          - ${state.agents.citizens.number}
          - 1
          value: ${simulation_metadata.INFINITY_TIME}
        test_result_date:
          dtype: int
          initialization_function: null
          learnable: false
          name: Date when agent receives test result
          shape:
          - ${state.agents.citizens.number}
          - 1
          value: ${simulation_metadata.INFINITY_TIME}
        charlson_comorbidity_index:
          dtype: int
          initialization_function:
            arguments:
              attribute:
                initialization_function: null
                learnable: false
                name: Charlson comorbidity index
                shape: null
                value: comorbidity
              file_path:
                initialization_function: null
                learnable: false
                name: Filepath for comorbidity data
                shape:
                - 1
                value: ${simulation_metadata.age_group_file}
            generator: load_population_attribute
          learnable: false
          name: Charlson Comorbidity Index
          shape:
          - ${state.agents.citizens.number}
          - 1
        sex:
          dtype: int
          initialization_function:
            arguments:
              attribute:
                initialization_function: null
                learnable: false
                name: Sex
                shape: null
                value: sex
              file_path:
                initialization_function: null
                learnable: false
                name: Filepath for sex data
                shape:
                - 1
                value: ${simulation_metadata.age_group_file}
            generator: load_population_attribute
          learnable: false
          name: Sex
          shape:
          - ${state.agents.citizens.number}
          - 1
        income_level:
          dtype: int
          initialization_function:
            arguments:
              attribute:
                initialization_function: null
                learnable: false
                name: Income level
                shape: null
                value: income
              file_path:
                initialization_function: null
                learnable: false
                name: Filepath for income data
                shape:
                - 1
                value: ${simulation_metadata.age_group_file}
            generator: load_population_attribute
          learnable: false
          name: Income Level
          shape:
          - ${state.agents.citizens.number}
          - 1
  environment:
    SFInfector:
      dtype: float
      initialization_function: null
      learnable: false
      name: Infectiousness of Infector
      shape:
      - 5
      value:
      - 0.0
      - 0.33
      - 0.72
      - 0.0
      - 0.0
    SFSusceptibility:
      dtype: float
      initialization_function: null
      learnable: false
      name: Susceptibility by Age Group
      shape:
      - 8
      value:
      - 0.40
      - 0.38
      - 0.79
      - 0.86
      - 0.80
      - 0.82
      - 0.88
      - 0.74
    SFInfectorAge:
      dtype: float
      initialization_function: null
      learnable: false
      name: Infectiousness by Age Group of the Infector
      shape:
      - 8
      value:
      - 0.7934
      - 0.7934
      - 0.8751
      - 1.0054
      - 1.0582
      - 1.0893
      - 1.1446
      - 1.1693
    daily_deaths:
      dtype: float
      initialization_function: null
      learnable: false
      name: daily_deaths
      shape:
      - ${simulation_metadata.num_steps_per_episode}
      value: 0
    daily_hosp:
      dtype: float
      initialization_function: null
      learnable: false
      name: daily_hosp
      shape:
      - ${simulation_metadata.num_steps_per_episode}
      value: 0
    daily_infected:
      dtype: float
      initialization_function: null
      learnable: false
      name: daily_infected
      shape:
      - ${simulation_metadata.num_steps_per_episode}
      value: 0
    exposed_to_infected_time:
      dtype: float
      initialization_function: null
      learnable: false
      name: Time from Exposed to Infected
      shape:
      - 1
      value: 3
    infected_to_recovered_time:
      dtype: float
      initialization_function: null
      learnable: false
      name: Infected to Recovered time
      shape:
      - 1
      value: 5
    lam_gamma_integrals:
      dtype: float
      initialization_function:
        arguments:
          rate:
            dtype: float
            initialization_function: null
            learnable: false
            name: Lam Gamma Rate
            shape:
            - 1
            value: 2.4
          scale:
            dtype: float
            initialization_function: null
            learnable: false
            name: Lam Gamma Scale
            shape:
            - 1
            value: 5.5
          t:
            dtype: int
            initialization_function: null
            learnable: false
            name: Num Steps
            shape:
            - 1
            value: ${simulation_metadata.num_steps_per_episode}
        generator: get_lam_gamma_integrals
      learnable: false
      name: Lam Gamma Integrals
      shape:
      - 10
    mean_interactions:
      dtype: int
      initialization_function:
        arguments:
          file_path:
            initialization_function: null
            learnable: false
            name: Filepath for age group stage
            shape:
            - 1
            value: ${simulation_metadata.age_group_file}
        generator: get_mean_agent_interactions
      learnable: false
      name: Mean agent interactions across networks
      shape:
      - ${simulation_metadata.num_agents}
      - 1
    mortality_rate:
      dtype: float
      initialization_function: null
      learnable: false
      name: Mortality Rate
      shape:
      - 1
      value: 0.2
    quarantine_break_prob:
      dtype: float
      initialization_function: null
      learnable: false
      name: Probability of breaking a quarantine mandate prior to recovery
      shape:
      - 1
      value: 0.1
    quarantine_start_prob:
      dtype: float
      initialization_function: null
      learnable: false
      name: Probability of complying to a quarantine mandate
      shape:
      - 1
      value: 0.7
    test_compliance_prob:
      dtype: float
      initialization_function: null
      learnable: false
      name: Probability of complying to test recommendation
      shape:
      - 1
      value: 0.95
    test_false_positive_prob:
      dtype: float
      initialization_function: null
      learnable: false
      name: Probability of false positive test result
      shape:
      - 1
      value: 0.3
    test_true_positive_prob:
      dtype: float
      initialization_function: null
      learnable: false
      name: Probability of true positive test result
      shape:
      - 1
      value: 0.8
  network:
    agent_agent:
      infection_network:
        arguments:
          file_path: ${simulation_metadata.infection_network_file}
        type: network_from_file
  objects: null
substeps:
  '0':
    active_agents:
    - citizens
    description: Transmission of new infections
    name: Transmission
    observation:
      citizens: null
    policy:
      citizens:
        make_isolation_decision:
          arguments:
            align_adjustment_vector:
              dtype: float
              initialization_function: null
              learnable: false
              name: align LLM agents to the populations by shifting
              shape:
              - 6
              value: 0.3
            align_vector:
              dtype: float
              initialization_function: null
              learnable: false
              name: align LLM agents to the populations by scaling
              shape:
              - 6
              value: 0.3
            initial_isolation_prob:
              dtype: float
              initialization_function: null
              learnable: false
              name: initialize infection prob for the LLM
              shape:
              - 6
              value: 0.5
          generator: MakeIsolationDecision
          input_variables:
            age: agents/citizens/age
          output_variables:
          - isolation_decision
    reward: null
    transition:
      new_transmission:
        arguments:
          R2:
            dtype: float
            initialization_function: null
            learnable: true
            name: R2
            shape:
            - ${simulation_metadata.NUM_WEEKS}
            - 1
            value: 5.0
          R_community:
            dtype: float
            initialization_function: null
            learnable: true
            name: R_community
            shape:
            - 1
            value: 0.3
          spatial_mixing_logits:
            dtype: float
            initialization_function: null
            learnable: true
            name: Spatial mixing weights (municipality, region, national)
            shape:
            - 3
            value:
            - 2.0
            - 1.0
            - 0.0
          spatial_local_pop_slope:
            dtype: float
            initialization_function: null
            learnable: true
            name: Population-dependent local mixing slope
            shape:
            - 1
            value: 0.3
          q_layers:
            dtype: float
            initialization_function: null
            learnable: true
            name: Per-layer transmission weights
            shape:
            - 5
            value:
            - 0.4
            - 0.5
            - 0.1
            - 0.2
            - 0.3
          spillover_logits:
            dtype: float
            initialization_function: null
            learnable: true
            name: Per-NPI spillover logits (n_npis × n_layers, init from literature priors)
            shape:
            - 9
            - 5
            value: 0.0
        generator: NewTransmission
        input_variables:
          SFInfector: environment/SFInfector
          SFSusceptibility: environment/SFSusceptibility
          adjacency_matrix: network/agent_agent/infection_network/adjacency_matrix
          age: agents/citizens/age
          daily_infected: environment/daily_infected
          disease_stage: agents/citizens/disease_stage
          exposed_to_infected_time: environment/exposed_to_infected_time
          infected_time: agents/citizens/infected_time
          lam_gamma_integrals: environment/lam_gamma_integrals
          mean_interactions: environment/mean_interactions
          next_stage_time: agents/citizens/next_stage_time
        output_variables:
        - disease_stage
        - next_stage_time
        - infected_time
        - daily_infected
  '1':
    active_agents:
    - citizens
    description: Evolution of previously infected agents
    name: Disease Progression
    observation:
      citizens: null
    policy:
      citizens: null
    reward: null
    transition:
      seirm_progression:
        arguments:
          M:
            dtype: float
            initialization_function: null
            learnable: true
            name: Mortality Rate
            shape:
            - 1
            value: 0.12
          H:
            dtype: float
            initialization_function: null
            learnable: true
            name: Hospitalization Rate
            shape:
            - 1
            value: 0.05
        generator: SEIRMProgression
        input_variables:
          daily_deaths: environment/daily_deaths
          daily_hosp: environment/daily_hosp
          disease_stage: agents/citizens/disease_stage
          exposed_to_infected_time: environment/exposed_to_infected_time
          infected_to_recovered_time: environment/infected_to_recovered_time
          next_stage_time: agents/citizens/next_stage_time
        output_variables:
        - disease_stage
        - next_stage_time
        - daily_deaths
        - daily_hosp
  '2':
    active_agents:
    - citizens
    description: Vaccination rollout
    name: Vaccination
    observation:
      citizens: null
    policy:
      citizens: null
    reward: null
    transition:
      vaccination_rollout:
        arguments: {}
        generator: VaccinationRollout
        input_variables:
          age: agents/citizens/age
          disease_stage: agents/citizens/disease_stage
        output_variables: []
  '3':
    active_agents:
    - citizens
    description: Testing and isolation feedback
    name: Testing
    observation:
      citizens: null
    policy:
      citizens: null
    reward: null
    transition:
      testing_and_isolation:
        arguments: {}
        generator: TestingAndIsolation
        input_variables:
          disease_stage: agents/citizens/disease_stage
          is_quarantined: agents/citizens/is_quarantined
        output_variables: []
